<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Matt Godbolt" />
    <meta name="description" content="A Javascript BBC Micro emulator" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';" />
    <title>jsbeeb - Javascript BBC Micro emulator</title>
    <style>
      /* Unstyled, the document is a wall of modal text; jsbeeb.css reveals the body. */
      html {
        color-scheme: dark;
      }
      /* The colour goes here, not on html: #screen is at z-index -1, so it only stays visible
         while body's background propagates to the canvas instead of painting a box over it. */
      body {
        background: #222;
        visibility: hidden;
      }
    </style>
    <link rel="shortcut icon" href="/favicon.ico" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <!-- include: html/navbar.html -->

    <div id="audio-warning" class="alert alert-warning initially-hidden">
      Your browser has suspended audio -- mouse click or key press for sound.
    </div>

    <div>
      <div id="outer">
        <div id="cub-monitor">
          <!-- Image is dynamically swapped by config.js based on filter.displayImage -->
          <img
            id="cub-monitor-pic"
            width="896"
            height="648"
            src="images/cub-monitor.png"
            alt="A fake CUB computer monitor"
          />
          <div class="sidebar left"><img src="images/placeholder.png" alt="" /></div>
          <canvas id="screen" width="896" height="600"></canvas>
          <div class="sidebar right"><img src="images/placeholder.png" alt="" /></div>
          <div class="sidebar bottom"><img src="images/placeholder.png" alt="" /></div>
        </div>
      </div>
      <canvas id="audio-stats" width="400" height="100"></canvas>
      <!-- include: html/panels.html -->
      <!-- include: html/debugger.html -->
      <!-- include: html/lights.html -->
      <!-- include: html/media.html -->
    </div>

    <!-- include: html/about.html -->

    <!-- include: html/help.html -->

    <!-- include: html/dialogs.html -->

    <!-- include: html/settings.html -->
    <textarea id="ime-reset" tabindex="-1" aria-hidden="true"></textarea>
  </body>
</html>
