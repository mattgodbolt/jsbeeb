name: jsbeeb tests

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm install
        run: npm install
      - name: checks
        run: npm run ci-checks
      # Vitest 4's job summary has a fixed "Vitest Test Report" heading, so each
      # run gets a heading of its own first to tell the three apart. Vitest 5
      # names them itself; the echoes go when we move to it (#947).
      - name: Unit tests
        run: |
          echo "# Unit tests" >> "$GITHUB_STEP_SUMMARY"
          npm run coverage:unit -- --silent=true
      - name: Coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
      # Vitest 5 may bring a first-party badge story; until then shields.io
      # renders badge.json from the deployed report.
      - name: Publish coverage report and badge
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct.toFixed(1)")
          COLOR=$(node -p "const p=$PCT; p>=90?'brightgreen':p>=75?'green':p>=60?'yellowgreen':p>=45?'yellow':'orange'")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > coverage/badge.json
          aws s3 sync coverage s3://bbc.xania.org/coverage \
            --no-progress --delete \
            --exclude "coverage-final.json" --exclude "lcov.info" --exclude "lcov-report/*" --exclude ".tmp/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
      - name: Integration tests
        run: |
          echo "# Integration tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:integration
      - name: Shader tests
        run: |
          echo "# Shader tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:shader
      - name: Smoke test
        run: |
          echo "# Smoke test" >> "$GITHUB_STEP_SUMMARY"
          npm run test:smoke | tee >(sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY")

  cpu-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm install
        run: npm install
      - name: CPU tests
        run: npm run test:cpu

  build-electron-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm install
        run: npm install
      - name: Build web distribution
        run: npm run build
      - name: Build Electron packages in Docker
        run: |
          docker run --rm \
            -v "$(pwd)":/project \
            electronuserland/builder:latest \
            /bin/bash -c "cd /project && npm run electron:build"
      - name: Verify packages were created
        run: |
          ls -lh out/dist/*.deb out/dist/*.rpm

  update-web:
    needs: [build-and-test, cpu-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build distribution
        run: |
          make dist
      - name: Deploy to S3
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          # Names under assets/ contain a content hash. Upload before the html that names them.
          aws s3 sync dist/assets s3://bbc.xania.org/assets \
            --no-progress \
            --cache-control "max-age=31536000,immutable" --metadata-directive REPLACE
          aws s3 sync dist s3://bbc.xania.org \
            --no-progress --exclude "assets/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
