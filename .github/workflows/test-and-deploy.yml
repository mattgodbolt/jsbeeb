name: jsbeeb tests

# push covers same-repo branches (a PR here opens moments after the push);
# pull_request exists for forks, so the job guards skip same-repo PR events
# to avoid running everything twice.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: checks
        run: npm run ci-checks

  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Unit tests
        env:
          VITEST_JOB_SUMMARY_TITLE: Unit tests
        run: npm run test:unit -- --coverage
      - name: Coverage report
        # The PR comment needs a write token, which fork pull_request events do not get.
        if: always() && github.event_name != 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
      # shields.io renders badge.json from the deployed report. The label says "unit"
      # because coverage instruments only the unit suite; the CPU-bound integration
      # tests blow their timeouts under v8 instrumentation (#1002).
      - name: Publish coverage report and badge
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct.toFixed(1)")
          COLOR=$(node -p "const p=$PCT; p>=90?'brightgreen':p>=75?'green':p>=60?'yellowgreen':p>=45?'yellow':'orange'")
          printf '{"schemaVersion":1,"label":"unit coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > coverage/badge.json
          aws s3 sync coverage s3://bbc.xania.org/coverage \
            --no-progress --delete \
            --exclude "coverage-final.json" --exclude "lcov.info" --exclude "lcov-report/*" --exclude ".tmp/*" \
            --cache-control max-age=30 --metadata-directive REPLACE

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Integration tests
        env:
          VITEST_JOB_SUMMARY_TITLE: Integration tests
        run: npm run test:integration
      - name: Benchmark workloads are what their script builds
        run: npm run test:benchmark-workloads
      - name: Same-answer check
        run: npm run test:same-answer
      - name: Shader tests
        env:
          VITEST_JOB_SUMMARY_TITLE: Shader tests
        run: npm run test:shader

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Built scripts parse at the browser floor
        run: |
          echo "# Built scripts parse at the browser floor" >> "$GITHUB_STEP_SUMMARY"
          if npm run test:dist-syntax; then result=passed; else result="failed; the step's log says where"; fi
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = passed ]
      - name: End-to-end tests
        run: |
          echo "# End-to-end tests" >> "$GITHUB_STEP_SUMMARY"
          if npm run test:e2e; then result=passed; else result="failed; the step's log and the Playwright traces say which test"; fi
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = passed ]
      - name: Keep the Playwright report and traces of any failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  cpu-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: CPU tests
        run: |
          echo "# CPU tests" >> "$GITHUB_STEP_SUMMARY"
          if npm run test:cpu; then result=passed; else result="failed; the step's log says which test"; fi
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = passed ]

  build-electron-packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build web distribution
        run: npm run build
      - name: Build Electron packages in Docker
        run: |
          docker run --rm \
            -v "$(pwd)":/project \
            electronuserland/builder:latest \
            /bin/bash -c "cd /project && npm run electron:build"
      - name: Verify packages were created
        run: |
          ls -lh out/dist/*.deb out/dist/*.rpm

  update-web:
    needs: [checks, unit, integration, e2e, cpu-test]
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'deploy-web' || format('update-web-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build distribution
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          make dist
      # Test runs finish out of order, so an older commit can reach the deploy after a newer one.
      - name: Check this is still the newest commit on main
        id: newest
        if: github.ref == 'refs/heads/main'
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/main)
          tip=${tip%%[[:space:]]*}
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: main has moved on to $tip, whose own run deploys it if its tests pass"
          fi
      - name: Deploy the rendezvous function
        if: steps.newest.outputs.deploy == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          zip -j rendezvous.zip rendezvous/*
          # A previous update that Failed must not block this one; one still in progress fails the next line anyway.
          aws lambda wait function-updated-v2 --function-name jsbeeb-rendezvous || true
          aws lambda update-function-code --function-name jsbeeb-rendezvous --zip-file fileb://rendezvous.zip
          aws lambda wait function-updated-v2 --function-name jsbeeb-rendezvous
      - name: Deploy to S3
        if: steps.newest.outputs.deploy == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          # Names under assets/ contain a content hash. Upload before the html that names them.
          aws s3 sync dist/assets s3://bbc.xania.org/assets \
            --no-progress \
            --cache-control "max-age=31536000,immutable" --metadata-directive REPLACE
          aws s3 sync dist s3://bbc.xania.org \
            --no-progress --exclude "assets/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
