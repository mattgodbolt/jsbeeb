name: jsbeeb tests

# push covers same-repo branches (a PR here opens moments after the push);
# pull_request exists for forks, so the job guards skip same-repo PR events
# to avoid running everything twice.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Check every test suite has a workflow step
        run: |
          node -e '
            const steps = ["test:unit", "test:integration", "test:cpu", "test:shader", "test:e2e"];
            const scripts = Object.keys(require("./package.json").scripts).filter((s) => s.startsWith("test:"));
            const missing = scripts.filter((s) => !steps.includes(s));
            const stale = steps.filter((s) => !scripts.includes(s));
            if (missing.length) console.error(`No workflow step runs: ${missing}. Add a step and list it here.`);
            if (stale.length) console.error(`Listed in the workflow but not package.json: ${stale}`);
            if (missing.length || stale.length) process.exit(1);
          '
      - name: checks
        run: npm run ci-checks
      # Vitest 4's job summary has a fixed "Vitest Test Report" heading, so each
      # run gets a heading of its own first to tell the three apart. Vitest 5
      # names them itself; the echoes go when we move to it (#947).
      - name: Unit tests
        run: |
          echo "# Unit tests" >> "$GITHUB_STEP_SUMMARY"
          npm run coverage:unit -- --silent=true
      - name: Coverage report
        # The PR comment needs a write token, which fork pull_request events do not get.
        if: always() && github.event_name != 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
      # shields.io renders badge.json from the deployed report. The label says "unit"
      # because coverage instruments only the unit suite; the CPU-bound integration
      # tests blow their timeouts under v8 instrumentation (#1002).
      - name: Publish coverage report and badge
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct.toFixed(1)")
          COLOR=$(node -p "const p=$PCT; p>=90?'brightgreen':p>=75?'green':p>=60?'yellowgreen':p>=45?'yellow':'orange'")
          printf '{"schemaVersion":1,"label":"unit coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > coverage/badge.json
          aws s3 sync coverage s3://bbc.xania.org/coverage \
            --no-progress --delete \
            --exclude "coverage-final.json" --exclude "lcov.info" --exclude "lcov-report/*" --exclude ".tmp/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
      - name: Integration tests
        run: |
          echo "# Integration tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:integration
      - name: Shader tests
        run: |
          echo "# Shader tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:shader
      - name: End-to-end tests
        run: |
          echo "# End-to-end tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:e2e
      - name: Keep the Playwright report and traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  cpu-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: CPU tests
        run: npm run test:cpu

  build-electron-packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build web distribution
        run: npm run build
      - name: Build Electron packages in Docker
        run: |
          docker run --rm \
            -v "$(pwd)":/project \
            electronuserland/builder:latest \
            /bin/bash -c "cd /project && npm run electron:build"
      - name: Verify packages were created
        run: |
          ls -lh out/dist/*.deb out/dist/*.rpm

  update-web:
    needs: [build-and-test, cpu-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build distribution
        run: |
          make dist
      - name: Deploy to S3
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          # Names under assets/ contain a content hash. Upload before the html that names them.
          aws s3 sync dist/assets s3://bbc.xania.org/assets \
            --no-progress \
            --cache-control "max-age=31536000,immutable" --metadata-directive REPLACE
          aws s3 sync dist s3://bbc.xania.org \
            --no-progress --exclude "assets/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
