<div id="rewind-panel" data-feature="rewind" hidden>
  <div class="rewind-header">
    <button id="rewind-close" class="btn btn-sm btn-outline-light" title="Close (Escape)">Close</button>
    <span class="rewind-title">Rewind</span>
  </div>
  <div class="rewind-filmstrip" id="rewind-filmstrip"></div>
</div>
<div id="session-pane" hidden role="dialog" aria-labelledby="session-pane-title">
  <div class="panel-header" title="Drag to move">
    <span class="panel-title" id="session-pane-title">Shared session</span>
    <span class="session-you"></span>
    <button type="button" class="btn btn-sm btn-outline-light panel-close" title="Close (Escape)">Close</button>
  </div>
  <div class="panel-body">
    <div class="session-link-row">
      <span class="session-link"></span>
      <button type="button" class="btn btn-sm btn-light session-copy-link">Copy link</button>
    </div>
    <div class="session-control-row">
      <span class="session-control"></span>
      <button type="button" class="btn btn-sm btn-light session-take">Take control</button>
      <label class="session-take-on-key-label">
        <input type="checkbox" class="form-check-input session-take-on-key" autocomplete="off" />
        Whoever presses a key takes control
      </label>
    </div>
    <table class="session-people">
      <thead>
        <tr>
          <th></th>
          <th>Who</th>
          <th>How it's going</th>
          <th class="number">Round trip</th>
          <th class="number">Behind</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button type="button" class="btn btn-sm btn-outline-light session-report">Save session report</button>
  </div>
</div>
<div id="disc-panel" data-feature="disc_surface" hidden>
  <div class="panel-header">
    <span class="panel-title">Disc surface</span>
    <span id="disc-name"></span>
    <button type="button" id="disc-close" class="btn btn-sm btn-outline-light panel-close">Close</button>
  </div>
  <div class="panel-body">
    <div class="disc-controls">
      <div class="btn-group btn-group-sm" role="group" aria-label="Drive">
        <button type="button" class="btn btn-outline-light" data-drive="0">Drive 0</button>
        <button type="button" class="btn btn-outline-light" data-drive="1">Drive 1</button>
      </div>
      <div class="btn-group btn-group-sm" role="group" aria-label="Side" id="disc-side-controls" hidden>
        <button type="button" class="btn btn-outline-light" data-side="0">Side 0</button>
        <button type="button" class="btn btn-outline-light" data-side="1">Side 1</button>
      </div>
      <div class="btn-group btn-group-sm" role="group" aria-label="View">
        <button type="button" class="btn btn-outline-light" data-view="density">Pulses</button>
        <button type="button" class="btn btn-outline-light" data-view="format">Format</button>
      </div>
      <button
        type="button"
        class="btn btn-sm btn-outline-light"
        id="disc-report-toggle"
        aria-pressed="false"
        title="List what is odd about this side of the disc"
      >
        Report
      </button>
    </div>
    <div class="disc-stack">
      <canvas id="disc-surface"></canvas>
      <canvas id="disc-overlay"></canvas>
    </div>
    <div class="disc-legend" id="disc-legend"></div>
    <div class="disc-status" id="disc-status"></div>
    <div class="disc-status" id="disc-hover-where"></div>
    <div class="disc-status" id="disc-hover-what"></div>
    <ul class="disc-report" id="disc-report" hidden></ul>
  </div>
</div>
