<div
  class="modal fade"
  id="configuration"
  data-feature="settings"
  tabindex="-1"
  aria-labelledby="configurationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="configurationModalLabel"><span class="bbc-model"></span> settings</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="restart-pending" class="alert alert-warning py-1 px-2 small d-none" role="status">
          The model and peripherals shown here take effect when the emulator next restarts.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
