<div id="drop-zone" class="drop-zone" hidden aria-hidden="true">
  <div class="drop-zone-card">
    <b class="drop-zone-what">Drop a disc, tape or save state</b>
    <span class="drop-zone-into"></span>
  </div>
</div>
<div id="media-panel" data-feature="media_window" hidden role="dialog" aria-labelledby="media-title">
  <div class="panel-header media-header" title="Drag to move">
    <span class="panel-title" id="media-title">Media</span>
    <span id="media-summary"></span>
    <button type="button" id="media-close" class="btn btn-sm btn-outline-light panel-close" title="Close (Escape)">
      Close
    </button>
  </div>
  <div class="media-rack">
    <section class="media-unit media-case" aria-label="Disc drives">
      <div class="unit-lip"></div>
      <div class="bays"></div>
    </section>
    <section class="media-unit media-deck" id="media-deck" aria-label="Cassette deck">
      <button type="button" class="fold-bar deck-bar" id="deck-toggle" title="Show the cassette deck">
        <span class="hwlabel">cassette</span>
        <span class="fold-bar-name" id="deck-bar-name"></span>
        <span class="fold-bar-show">Show</span>
      </button>
      <div class="unit-lip"></div>
      <div class="deck-head">
        <div class="deck-leds">
          <i class="deck-led on" role="img" title="Power: the deck is on" aria-label="Power on"></i><span>power</span>
          <i class="deck-led data" id="deck-data" aria-hidden="true" title="Data: lights as blocks pass the head"></i
          ><span>data</span>
        </div>
        <div class="counter-wrap">
          <span>counter</span>
          <span class="counter-row">
            <span class="counter" id="tape-counter" role="img" title="Tape counter"> <b>0</b><b>0</b><b>0</b> </span>
            <button
              type="button"
              class="counter-reset"
              id="tape-counter-reset"
              title="Reset the counter to 000"
              aria-label="Reset tape counter"
            ></button>
          </span>
        </div>
        <div class="deck-logo" aria-hidden="true">jsbeeb<small>data recorder</small></div>
      </div>
      <button type="button" class="deck-window" id="deck-window">
        <span class="cassette" id="deck-cassette" aria-hidden="true">
          <span class="tape-label"><b id="deck-tape-title"></b><span id="deck-tape-sub"></span></span>
          <span class="reels">
            <svg class="reel" viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="22" fill="#3b2a1c" />
              <circle cx="24" cy="24" r="10" fill="#efe6cc" stroke="#8a7f66" />
              <g stroke="#8a7f66" stroke-width="2.4" stroke-linecap="round">
                <line x1="24" y1="15" x2="24" y2="19" />
                <line x1="24" y1="29" x2="24" y2="33" />
                <line x1="16.2" y1="19.5" x2="19.7" y2="21.5" />
                <line x1="28.3" y1="26.5" x2="31.8" y2="28.5" />
                <line x1="16.2" y1="28.5" x2="19.7" y2="26.5" />
                <line x1="28.3" y1="21.5" x2="31.8" y2="19.5" />
              </g>
              <circle cx="24" cy="24" r="3.5" fill="#1a1613" />
            </svg>
            <svg class="reel small" viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="14" fill="#3b2a1c" />
              <circle cx="24" cy="24" r="10" fill="#efe6cc" stroke="#8a7f66" />
              <g stroke="#8a7f66" stroke-width="2.4" stroke-linecap="round">
                <line x1="24" y1="15" x2="24" y2="19" />
                <line x1="24" y1="29" x2="24" y2="33" />
                <line x1="16.2" y1="19.5" x2="19.7" y2="21.5" />
                <line x1="28.3" y1="26.5" x2="31.8" y2="28.5" />
                <line x1="16.2" y1="28.5" x2="19.7" y2="26.5" />
                <line x1="28.3" y1="21.5" x2="31.8" y2="19.5" />
              </g>
              <circle cx="24" cy="24" r="3.5" fill="#1a1613" />
            </svg>
          </span>
        </span>
        <span class="empty-tape" id="deck-empty"><b>no tape</b><span>click to load one</span></span>
      </button>
      <div class="deck-keys">
        <div class="key-labels" aria-hidden="true">
          <span>rew</span><span>play</span><span>stop</span><span>eject</span>
        </div>
        <div class="keys" role="group" aria-label="Tape transport">
          <button type="button" class="deck-key" id="tape-rewind" title="Rewind to the start">Rewind</button>
          <button type="button" class="deck-key" id="tape-play">Play</button>
          <button type="button" class="deck-key" id="tape-stop">Stop</button>
          <button type="button" class="deck-key" id="tape-eject">Eject</button>
        </div>
      </div>
      <div class="deck-line">
        <span class="status" id="deck-status"></span>
        <span class="status fail" id="deck-fail"></span>
        <button type="button" class="txt-btn primary" id="deck-retry" hidden>Retry</button>
        <span class="spacer"></span>
        <button type="button" class="txt-btn" id="deck-hide" title="Fold the recorder to one line">Hide</button>
      </div>
    </section>
  </div>
  <button
    type="button"
    class="fold-bar list-bar"
    id="list-toggle"
    aria-controls="media-list"
    title="Show the list of discs and tapes"
  >
    <span class="fold-bar-name">Discs and tapes</span>
    <span class="fold-bar-show">Show</span>
  </button>
  <div class="media-list-head">
    <div class="media-into">
      <span id="media-into-label">Into</span>
      <div class="btn-group btn-group-sm" role="group" aria-labelledby="media-into-label" id="media-into">
        <button
          type="button"
          class="btn btn-outline-light"
          aria-pressed="false"
          data-target="0"
          title="Load into drive 0"
        >
          Drive 0
        </button>
        <button
          type="button"
          class="btn btn-outline-light"
          aria-pressed="false"
          data-target="1"
          title="Load into drive 1"
        >
          Drive 1
        </button>
        <button
          type="button"
          class="btn btn-outline-light"
          aria-pressed="false"
          data-target="tape"
          title="Load into the cassette deck"
        >
          Cassette
        </button>
      </div>
    </div>
    <label class="media-search">
      <span class="visually-hidden">Search discs and tapes</span>
      <input
        type="search"
        id="media-search"
        class="form-control form-control-sm"
        placeholder="Search discs and tapes"
        aria-describedby="media-hint"
        autocomplete="off"
      />
    </label>
    <span class="media-count" id="media-count" role="status"></span>
    <label
      class="media-autoboot"
      title="Ticked, a click or Enter boots a disc it puts in drive 0 and Shift only loads it; unticked, the other way round"
    >
      <input type="checkbox" class="autoboot" />
      Autoboot after loading
    </label>
  </div>
  <div class="media-chips" id="media-chips" role="group" aria-label="Show"></div>
  <ul class="media-list" id="media-list" role="list" aria-label="Discs and tapes"></ul>
  <div class="media-hint" id="media-hint"></div>
  <div class="media-list-end">
    <button type="button" class="txt-btn list-hide" id="list-hide" title="Fold the list away">Hide list</button>
  </div>
  <div class="media-foot">
    <label class="btn btn-sm btn-outline-light" id="media-open-label">
      <span id="media-open-text">Open a file…</span>
      <input
        type="file"
        id="media-open"
        class="visually-hidden"
        accept=".ssd,.dsd,.adf,.adm,.adl,.hfe,.uef,.zip,application/binary"
      />
    </label>
    <button
      type="button"
      class="btn btn-sm btn-outline-light"
      id="media-new-disc"
      title="Make an empty, formatted disc that keeps its changes"
    >
      New blank disc…
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline-light"
      id="media-connect-drive"
      title="Sign in so your Google Drive images appear in the list"
    >
      Connect Google Drive
    </button>
  </div>
  <form class="media-new-disc" id="media-new-disc-form" hidden>
    <label>
      <span id="media-new-disc-label">Name</span>
      <input
        type="text"
        class="form-control form-control-sm"
        id="media-new-disc-name"
        placeholder="mydisc.ssd"
        autocomplete="off"
        spellcheck="false"
      />
    </label>
    <fieldset class="media-new-disc-where" id="media-new-disc-where">
      <legend class="visually-hidden">Where</legend>
      <label><input type="radio" name="media-new-disc-where" value="browser" checked /> in this browser</label>
      <label id="media-new-disc-drive-option"
        ><input type="radio" name="media-new-disc-where" value="gdrive" /> on Google Drive</label
      >
    </fieldset>
    <button type="submit" class="btn btn-sm btn-primary" id="media-new-disc-create">Create</button>
    <button type="button" class="btn btn-sm btn-outline-light" id="media-new-disc-cancel">Cancel</button>
  </form>
</div>
<template id="drive-bay-template">
  <section class="bay" data-state="empty">
    <button type="button" class="fold-bar bay-bar">
      <span class="hwlabel bay-bar-label"></span>
      <span class="fold-bar-name bay-bar-name"></span>
      <span class="fold-bar-show">Show</span>
    </button>
    <span class="bay-led led disc" role="img" aria-label="Drive idle"></span>
    <span class="lever-wrap">
      <button type="button" class="lever bay-eject"></button>
      <span class="hwlabel" aria-hidden="true">eject</span>
    </span>
    <div class="mouth">
      <button type="button" class="slot bay-slot">
        <span class="jacket">
          <span class="paper">
            <span class="title">
              <span class="bay-title"></span>
              <span class="dfs bay-dfs" title="DFS catalogue title and cycle number, read from the disc"></span>
            </span>
            <span class="sub bay-sub"></span>
          </span>
        </span>
        <span class="empty-note"><b>no disc</b><span>click to load one</span></span>
      </button>
    </div>
    <fieldset class="pitch">
      <legend class="bay-pitch-legend visually-hidden"></legend>
      <span class="hwlabel" aria-hidden="true">tracks</span>
      <label><span>40</span><input type="radio" value="40" /></label>
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <label><span>80</span><input type="radio" value="80" /></label>
    </fieldset>
    <div class="bay-badge" aria-hidden="true">
      <span class="logo">jsbeeb</span><span class="drive-no">drive<b class="bay-number"></b></span>
    </div>
    <div class="bay-line">
      <span class="status bay-status"></span>
      <span class="status bay-kept"></span>
      <span class="status fail bay-fail"></span>
      <button type="button" class="txt-btn primary bay-retry" hidden>Retry</button>
      <span class="spacer"></span>
      <button type="button" class="txt-btn bay-hide" hidden>Hide</button>
      <div class="dropdown">
        <button type="button" class="txt-btn bay-save dropdown-toggle" data-bs-toggle="dropdown">Save</button>
        <ul class="dropdown-menu dropdown-menu-dark">
          <li><button type="button" class="dropdown-item bay-save-ssd">Download as SSD/DSD</button></li>
          <li><button type="button" class="dropdown-item bay-save-hfe">Download as HFE</button></li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <button type="button" class="dropdown-item bay-save-drive">
              Save to Google Drive…
              <small class="d-block text-muted">a copy there that keeps its changes</small>
            </button>
          </li>
        </ul>
      </div>
      <button type="button" class="txt-btn bay-report">Report</button>
      <button type="button" class="txt-btn bay-surface">Surface</button>
    </div>
    <div class="bay-notes"></div>
  </section>
</template>
