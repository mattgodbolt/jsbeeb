<div id="watch-panel" data-feature="watches" hidden>
  <div class="panel-header">
    <span class="panel-title">Watches</span>
    <button type="button" id="watch-close" class="btn btn-sm btn-outline-light panel-close">Close</button>
  </div>
  <div class="panel-body">
    <form id="watch-add-form" role="form">
      <input
        type="text"
        id="watch-add"
        class="form-control form-control-sm panel-field"
        aria-label="Name or address to watch"
        placeholder="Name or address, then Enter"
        autocomplete="off"
      />
    </form>
    <table>
      <tbody class="watch-list"></tbody>
    </table>
    <div class="watch-empty">Nothing watched yet.</div>
  </div>
</div>
<div id="watch-menu" hidden></div>
<div id="toolbar-panel" class="debug-panel" data-feature="debug_toolbar" hidden>
  <div class="panel-header">
    <span class="panel-title">Debugger</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="Run and stop">
      <button type="button" class="btn btn-outline-light" data-run="go" aria-label="Run" title="Resume running (g)">
        <span data-icon="play-fill" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="btn btn-outline-light"
        data-run="stop"
        aria-label="Stop"
        title="Stop in the debugger (Alt-S)"
      >
        <span data-icon="pause-fill" aria-hidden="true"></span>
      </button>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Step">
      <button type="button" class="btn btn-outline-light" data-run="step" title="Step one instruction (n)">Step</button>
      <button
        type="button"
        class="btn btn-outline-light"
        data-run="stepOver"
        title="Step over a call, or a loop from its backward branch (m)"
      >
        Over
      </button>
      <button
        type="button"
        class="btn btn-outline-light"
        data-run="stepOut"
        title="Run until this subroutine or interrupt handler returns (o)"
      >
        Out
      </button>
      <button
        type="button"
        class="btn btn-outline-light"
        data-run="runToCursor"
        title="Run to the highlighted instruction (c)"
      >
        Cursor
      </button>
      <button
        type="button"
        class="btn btn-outline-light"
        data-run="runToVsync"
        title="Run to the start of the next vsync (v)"
      >
        VSync
      </button>
    </div>
    <button type="button" class="btn btn-sm btn-outline-light panel-close" aria-label="Close" title="Close">
      &times;
    </button>
  </div>
  <div class="panel-body tight-loop" hidden></div>
</div>
<div id="disassembly-panel" class="debug-panel" data-feature="debug_disassembly" hidden>
  <div class="panel-header">
    <span class="panel-title">Disassembly</span>
    <form role="form" id="goto-dis-addr-form" class="goto-form">
      <input
        type="text"
        class="form-control form-control-sm goto-addr panel-field"
        placeholder="Go to"
        aria-label="Disassembly address"
        autocomplete="off"
      />
    </form>
    <button type="button" class="btn btn-sm btn-outline-light panel-close" aria-label="Close" title="Close">
      &times;
    </button>
  </div>
  <div class="panel-body">
    <div id="disassembly">
      <div class="template dis_elem">
        <span class="bp_gutter"></span><span class="dis_addr">0000</span><span class="instr_bytes">11 22 33</span
        ><span class="instr_asc">ABC</span><span class="disassembly">LDA (&amp;70), X</span>
      </div>
    </div>
    <div class="debug-labels" hidden></div>
    <div class="debug-symbols"></div>
    <div class="panel-keys"></div>
    <button
      type="button"
      class="txt-btn"
      data-opens="breakpoints-panel"
      tabindex="-1"
      title="Open the list of breakpoints"
    >
      breakpoints
    </button>
  </div>
</div>
<div id="memory-panel" class="debug-panel" data-feature="debug_memory" hidden>
  <div class="panel-header">
    <span class="panel-title">Memory</span>
    <form role="form" id="goto-mem-addr-form" class="goto-form">
      <input
        type="text"
        class="form-control form-control-sm goto-addr panel-field"
        placeholder="Go to"
        aria-label="Memory address"
        autocomplete="off"
      />
    </form>
    <button
      type="button"
      id="memory-save-open"
      class="btn btn-sm btn-outline-light"
      title="Save a range of memory to a file"
    >
      Save
    </button>
    <button type="button" class="btn btn-sm btn-outline-light panel-close" aria-label="Close" title="Close">
      &times;
    </button>
  </div>
  <div class="panel-body">
    <form id="memory-save-form" role="form" hidden>
      <input
        type="text"
        name="from"
        class="form-control form-control-sm panel-field"
        aria-label="First address to save"
        autocomplete="off"
      />
      to
      <input
        type="text"
        name="to"
        class="form-control form-control-sm panel-field"
        aria-label="Last address to save"
        autocomplete="off"
      />
      <button type="submit" class="btn btn-sm btn-outline-light">Save</button>
    </form>
    <div id="memory">
      <div class="template">
        <span class="dis_addr">0000</span><span class="mem_bytes"></span><span class="mem_asc"></span>
      </div>
    </div>
    <div class="debug-symbols"></div>
    <div class="panel-keys"></div>
  </div>
</div>
<div id="registers-panel" class="debug-panel" data-feature="debug_registers" hidden>
  <div class="panel-header">
    <span class="panel-title">Registers</span>
    <form role="form" id="run-to-line-form" class="goto-form">
      <input
        type="text"
        class="form-control form-control-sm goto-addr panel-field"
        placeholder="Run to line"
        aria-label="Run to TV line"
        title="Run until the beam reaches this TV line, counted from vsync"
        autocomplete="off"
      />
    </form>
    <button type="button" class="btn btn-sm btn-outline-light panel-close" aria-label="Close" title="Close">
      &times;
    </button>
  </div>
  <div class="panel-body" id="registers">
    <div>
      <span class="register">A</span> <span id="cpu6502_a">00</span> <span class="register">X</span>
      <span id="cpu6502_x">00</span> <span class="register">Y</span> <span id="cpu6502_y">00</span>
      <span class="register">S</span> <span id="cpu6502_s">00</span>
    </div>
    <div>
      <span class="register">PC</span> <span id="cpu6502_pc">0000</span>
      <span class="flags"
        ><span class="flag" id="cpu6502_flag_n">N</span><span class="flag" id="cpu6502_flag_v">V</span
        ><span class="flag" id="cpu6502_flag_d">D</span><span class="flag" id="cpu6502_flag_i">I</span
        ><span class="flag" id="cpu6502_flag_z">Z</span><span class="flag" id="cpu6502_flag_c">C</span></span
      >
    </div>
    <div><span class="register">Stack</span> <span id="cpu6502_stack"></span></div>
    <div><span class="register">Cycles</span> <span id="cpu6502_cycles"></span></div>
    <div>
      <span class="register">Stopwatch</span> <span id="debug-stopwatch"></span>
      <button type="button" class="txt-btn" id="debug-stopwatch-reset" tabindex="-1" title="Start counting from now">
        reset
      </button>
    </div>
    <div title="Where the beam is in the TV's frame, counted from vsync">
      <span class="register">Frame</span> line <span id="beam-line"></span> cycle <span id="beam-cycle"></span>
    </div>
    <div id="beam-crtc" title="The 6845's character row, scanline within it and character column">
      <span class="register">CRTC</span> row <span id="crtc-row"></span> scan <span id="crtc-scanline"></span> col
      <span id="crtc-column"></span>
    </div>
  </div>
</div>
